<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Companies House App">
    <meta name="keyword" content="webapp, api">
    <meta property="og:title" content="Lux-Ferre | Companies House App"/>
    <meta property="og:description" content="Companies House App" />
    <meta property="og:image" content="{{ url_for('static', filename='assets/main/favicon.svg') }}"/>
    <meta property="og:url" content="https://luxferre.dev/projects/chouse" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Lux-Ferre | Companies House App" />
    <meta name="twitter:description" content="Companies House App"/>
    <meta name="twitter:image" content="{{ url_for('static', filename='assets/main/favicon.svg') }}"/>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/main/favicon.svg') }}">
    <title>Companies House</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='libraries/luxgrid/luxgrid.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='projects/companies_house/styles.css') }}">
    <style>
    </style>
</head>
<body data-theme="dark">
<header>
    <div class="col text-center">
        <h1>Companies House Lookup</h1>
    </div>
</header>
<main>
    <section id="settings_container" class="container">
        <div class="row">
            <div class="col">
                <div class="input_container" id="postcode_input_container">
                    <input class="input_element" type="text" id="postcode_input" placeholder="Type an outcode (first part of postcode)...">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="input_container" id="sic_input_container">
                    <input class="w-100 input_element" id="sic_search" type="text" placeholder="SIC Filter...">
                    <select class="w-100 input_element" id="sic_select"></select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="input_container justify-content-center" id="button_container">
                    <div class="input_element justify-content-center align-items-center primary-subtle" id="search_button">
                        <div class="throbber hidden"></div>
                        <span>Search</span>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section id="output_container" class="container">
        <textarea class="w-100" id="output" readonly></textarea>
    </section>
</main>
<template id="pill_template">
    <div class="pill justify-content-around align-items-center success">
        <span class="pill_text"></span>
        <span class="remove">x</span>
    </div>
</template>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="{{ url_for('static', filename='projects/companies_house/scripts.js') }}"></script>
</body>
</html>
